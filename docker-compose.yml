services:
  frontend:
    container_name: creator-frontend
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: development
    restart: unless-stopped
    env_file:
      - .env.production

    environment:
      NODE_ENV: development
     # Use relative URL so browser requests go through Next.js rewrites to backend container
      NEXT_PUBLIC_API_URL: /v1
      BACKEND_PROXY_URL: http://backend:4000
    ports:
      - "${FRONTEND_PORT}:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/next.config.ts:/app/next.config.ts
      - ./frontend/tailwind.config.ts:/app/tailwind.config.ts
      - ./frontend/postcss.config.mjs:/app/postcss.config.mjs
    depends_on:
      backend:
        condition: service_started
    networks:
      - creator-network
    security_opt:
      - no-new-privileges:true

  backend:
    container_name: creator-backend
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: development
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      PORT: ${BACKEND_PORT}
      MEDIA_STORAGE_DRIVER: ${MEDIA_STORAGE_DRIVER}
      MEDIA_STORAGE_PATH: ${MEDIA_STORAGE_PATH}
      MEDIA_MAX_FILE_SIZE_MB: ${MEDIA_MAX_FILE_SIZE_MB}
      FRONTEND_URL: ${FRONTEND_URL}
      NOTIFICATION_DRIVER: ${NOTIFICATION_DRIVER}
      NOTIFICATION_TEAM_EMAIL: ${NOTIFICATION_TEAM_EMAIL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO}
    ports:
      - "${BACKEND_PORT}:4000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./backend/.env.production:/app/.env.production
      - ./backend/package.json:/app/package.json
      - media_storage:${MEDIA_STORAGE_PATH}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - creator-network
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /app/node_modules/.cache
    ulimits:
      nproc: 65535
      nofile:
        soft: 2048
        hard: 4096
    command: npm run start:dev

  postgres:
    container_name: creator-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - creator-network

  # Dev-only SMTP catcher — lets the real SmtpProvider send real SMTP
  # traffic somewhere during local development/testing without needing real
  # mail credentials. Not part of the Leinaflow application; production
  # points SMTP_HOST at the real Cloudivo mail service via env vars only.
  mailhog:
    container_name: creator-mailhog
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks:
      - creator-network

  redis:
    container_name: creator-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - creator-network

networks:
  creator-network:
    name: creator-network
    driver: bridge

volumes:
  postgres_data:
    name: creator-postgres-data
  redis_data:
    name: creator-redis-data
  frontend_node_modules:
    name: creator-frontend-node-modules
  media_storage:
    name: creator-media-storage
