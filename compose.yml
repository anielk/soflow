services:
  frontend:
    container_name: ${PROJECT_NAME:-creator}-frontend
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    # No env_file here on purpose — which file supplies runtime env is
    # environment-specific (see compose.dev.yml/compose.demo.yml/
    # compose.prod.yml, each of which adds its own single env_file entry).
    # A shared default here would be silently wrong for whichever
    # environment(s) don't match it — see docs/deployment/Architecture.md.
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - creator-network
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    container_name: ${PROJECT_NAME:-creator}-backend
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    # No env_file here on purpose — see the frontend service's comment above.
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      PORT: ${BACKEND_PORT}
      MEDIA_STORAGE_DRIVER: ${MEDIA_STORAGE_DRIVER}
      MEDIA_STORAGE_PATH: ${MEDIA_STORAGE_PATH}
      MEDIA_MAX_FILE_SIZE_MB: ${MEDIA_MAX_FILE_SIZE_MB}
      FRONTEND_URL: ${FRONTEND_URL}
      NOTIFICATION_DRIVER: ${NOTIFICATION_DRIVER}
      NOTIFICATION_TEAM_EMAIL: ${NOTIFICATION_TEAM_EMAIL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO}
    volumes:
      - media_storage:${MEDIA_STORAGE_PATH}
      # Long-form tmpfs (not the short `tmpfs:` key) so we can set a
      # world-writable mode — Docker's tmpfs default is root:root 0755,
      # which the non-root user in compose.demo.yml/compose.prod.yml
      # (uid 1000) can't write into otherwise.
      - type: tmpfs
        target: /tmp
        tmpfs:
          mode: 0o1777
      - type: tmpfs
        target: /app/node_modules/.cache
        tmpfs:
          mode: 0o1777
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - creator-network
    security_opt:
      - no-new-privileges:true
    ulimits:
      nproc: 65535
      nofile:
        soft: 2048
        hard: 4096
    healthcheck:
      # Liveness only: any response means the Nest process is up and
      # listening. /v1/health's body reports 503 when an optional
      # dependency (e.g. the SMTP relay) is unreachable — that's real,
      # actionable information for monitoring, but frontend's startup
      # order shouldn't be gated on it, or a notification-provider outage
      # would block the whole stack from starting.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/v1/health', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    container_name: ${PROJECT_NAME:-creator}-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    # No env_file: every var Postgres actually needs (DB/user/password) is
    # already explicit below via ${...} interpolation, which itself now
    # comes from the environment-specific --env-file (see dc() in
    # deployment/lib/common.sh) — nothing else here reads from a file.
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - creator-network

  redis:
    container_name: ${PROJECT_NAME:-creator}-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - creator-network

networks:
  creator-network:
    # The `name:` below is the actual Docker resource name (parameterized
    # for multi-product reuse); the `creator-network` YAML key above is
    # just this file's internal alias and doesn't need to change.
    name: ${PROJECT_NAME:-creator}-network
    driver: bridge

volumes:
  postgres_data:
    name: ${PROJECT_NAME:-creator}-postgres-data
  redis_data:
    name: ${PROJECT_NAME:-creator}-redis-data
  media_storage:
    name: ${PROJECT_NAME:-creator}-media-storage
