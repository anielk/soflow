# Demo/staging overlay — same production build as compose.prod.yml, so
# performance and behavior on demo are representative of production.
#
#   docker compose -f compose.yml -f compose.demo.yml up -d --build
#
# Keep this file's service definitions in sync with compose.prod.yml — the
# two are intentionally near-identical (see docs/deployment/Architecture.md).
# The only thing that's meant to differ between demo and production is the
# content of the per-host .env / .env.production files, not this compose
# logic.
services:
  frontend:
    build:
      target: production
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    # Fixed on purpose — not ${FRONTEND_PORT}-driven like development's
    # mapping. The existing Nginx Proxy Manager (infrastructure, outside
    # this repo) already forwards to host port 80 and must never need
    # reconfiguring on a redeploy, so this host port can't vary by-host
    # the way development's ports do. Backend stays `expose`-only
    # (internal, see below) — NPM reaches it through the frontend's own
    # `/v1/:path*` rewrite (frontend/next.config.mjs), not directly.
    ports:
      - "80:3000"
    read_only: true
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          mode: 0o1777
    user: "1000:1000"

  backend:
    build:
      target: production
    environment:
      NODE_ENV: production
    expose:
      - "4000"
    read_only: true
    user: "1000:1000"
