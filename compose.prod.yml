# Production overlay — identical service definitions to compose.demo.yml on
# purpose (see docs/deployment/Architecture.md): production must run the
# exact same image/build/runtime config demo already validated. Anything
# that differs between demo and production belongs in the per-host
# .env / .env.production files, not in this compose logic.
#
#   docker compose -f compose.yml -f compose.prod.yml up -d --build
#
# Keep this file's service definitions in sync with compose.demo.yml.
services:
  frontend:
    build:
      target: production
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    expose:
      - "3000"
    read_only: true
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          mode: 0o1777
    user: "1000:1000"

  backend:
    build:
      target: production
    environment:
      NODE_ENV: production
    expose:
      - "4000"
    read_only: true
    user: "1000:1000"

  nginx:
    container_name: ${PROJECT_NAME:-creator}-nginx
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - type: tmpfs
        target: /tmp
        tmpfs:
          mode: 0o1777
      - type: tmpfs
        target: /var/cache/nginx
        tmpfs:
          mode: 0o1777
      - type: tmpfs
        target: /var/run
        tmpfs:
          mode: 0o1777
    ports:
      - "80:80"
      - "443:443"
    networks:
      - creator-network
    security_opt:
      - no-new-privileges:true
    read_only: true
    user: "1000:1000"
    healthcheck:
      # Use 127.0.0.1, not localhost: BusyBox wget on Alpine resolves
      # localhost to ::1 (IPv6) first, but nginx only listens on IPv4
      # (0.0.0.0:80), so the healthcheck would fail with "Connection refused".
      test: ["CMD", "wget", "-q", "-O", "-", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
