# Production overlay — identical service definitions to compose.demo.yml on
# purpose (see docs/deployment/Architecture.md): production must run the
# exact same image/build/runtime config demo already validated. Anything
# that differs between demo and production belongs in the per-host
# .env.production file, not in this compose logic — both environments read
# only .env.production, never .env.development (see deployment/lib/common.sh's
# env_file_for()).
#
#   docker compose -f compose.yml -f compose.prod.yml up -d --build
#
# Keep this file's service definitions in sync with compose.demo.yml.
services:
  frontend:
    build:
      target: production
      # Both vars must also be passed as build args — `next build` inlines
      # NEXT_PUBLIC_API_URL into the client bundle AND freezes
      # BACKEND_PROXY_URL into .next/routes-manifest.json (verified: a
      # container started with a different BACKEND_PROXY_URL still proxies
      # to the build-time value). The `environment:` entries below are
      # necessary but not sufficient — see docker/frontend.Dockerfile.
      #
      # The `:?` guard is defense in depth against exactly the failure mode
      # that caused a real incident: someone runs `docker compose build`
      # directly instead of through deployment/deploy.sh, and Compose's own
      # implicit `.env` auto-lookup (or no file at all) silently supplies a
      # blank or wrong-environment value. `deployment/lib/common.sh`'s dc()
      # always passes `--env-file .env.production` explicitly for this
      # overlay, so the normal path never hits this — but a bypass now fails
      # loudly instead of building a broken image.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is not set. Run this via deployment/deploy.sh, or pass --env-file .env.production explicitly — do not rely on Docker Compose's own .env auto-lookup for this overlay.}
        BACKEND_PROXY_URL: http://backend:4000
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      # Kept for any future code that reads this at actual runtime — the
      # `/v1/:path*` rewrite itself already got its value from the build arg
      # above and won't see a change here. Must be the backend's Docker
      # service name, not localhost (frontend and backend are separate
      # containers on creator-network).
      BACKEND_PROXY_URL: http://backend:4000
    env_file:
      - .env.production
    # Fixed on purpose — not ${FRONTEND_PORT}-driven like development's
    # mapping. The existing Nginx Proxy Manager (infrastructure, outside
    # this repo) already forwards to host port 80 and must never need
    # reconfiguring on a redeploy, so this host port can't vary by-host
    # the way development's ports do. Backend stays `expose`-only
    # (internal, see below) — NPM reaches it through the frontend's own
    # `/v1/:path*` rewrite (frontend/next.config.mjs), not directly.
    ports:
      - "80:3000"
    read_only: true
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          mode: 0o1777
    user: "1000:1000"

  backend:
    build:
      target: production
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    expose:
      - "4000"
    read_only: true
    user: "1000:1000"
